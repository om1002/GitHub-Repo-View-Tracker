name: GitHub Repo View Tracker

on:
  schedule:
    - cron: '0 0 * * *' # Highly recommended to run daily so you never miss data gaps
  workflow_dispatch:

# 🟢 CRITICAL: This grants permission to commit the JSON updates back to your repo
permissions:
  contents: write

jobs:
  update-views:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Upgraded to latest secure runner version

      - name: Set up Python
        uses: actions/setup-python@v5 # Upgraded to latest runner version
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install PyGithub

      # ... (previous code remains exactly the same) ...

      - name: Run the Tracker Script
        env:
          # Change this line to use your newly added Personal Access Token
          GITHUB_TOKEN: ${{ secrets.PAT}}
        run: python repo_view_tracker.py

      # ... (rest of the push/commit code remains exactly the same) ...

        
      - name: Commit and Push Updated View Counts
        run: |
          # Use your specific GitHub account profile info for the commit log
          git config --global user.name "om1002"
          git config --global user.email "your-email@example.com"
          
          # Only attempt a push if the repo_views.json file actually changed
          if git status --porcelain | grep -q "repo_views.json"; then
            git add repo_views.json
            git commit -m "Update repo view counts (Automated) [skip ci]"
            
            # Clean, modern push command using the runner's native authentication
            git push origin HEAD:main
          else
            echo "No traffic changes found today. Skipping commit."
          fi
